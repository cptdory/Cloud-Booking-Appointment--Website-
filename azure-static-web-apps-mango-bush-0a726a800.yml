name: Azure Static Web Apps CI/CD

pr:
  branches:
    include:
      - main
trigger:
  branches:
    include:
      - main

jobs:
- job: build_and_deploy_job
  displayName: Build and Deploy Job
  condition: or(
    eq(variables['Build.Reason'], 'Manual'),
    or(
      eq(variables['Build.Reason'], 'PullRequest'),
      eq(variables['Build.Reason'], 'IndividualCI')
    )
  )
  pool:
    vmImage: ubuntu-latest
  variables:
  - group: Azure-Static-Web-Apps-mango-bush-0a726a800-variable-group

  steps:
  - checkout: self
    submodules: true

  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'   # Use Node 20 for Next.js 16
    displayName: 'Install Node.js'

  - script: |
      npm install
      npm run build
    displayName: 'Install dependencies and build Next.js app'

  - task: AzureStaticWebApp@0
    inputs:
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_BUSH_0A726A800)
###### Repository/Build Configurations ######
      app_location: "."      # Root of your project
      output_location: ".next"  # Where Next.js outputs its build
      api_location: ""       # No API folder
###### End ######
