# Next.js build + deploy on Azure Static Web Apps
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  NODE_ENV: production

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js 20.x'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npm run build
    displayName: 'Build Next.js app'
    env:
      NODE_ENV: $(NODE_ENV)

  - task: AzureStaticWebApp@0
    inputs:
      app_location: "/"
      api_location: ""          # Leave empty if you don’t have Azure Functions
      output_location: ".next"  # <-- use .next for SSR builds
    displayName: 'Deploy to Azure Static Web App'
    env:
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)
