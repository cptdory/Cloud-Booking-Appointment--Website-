name: SWA-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

jobs:
- job: build_and_deploy_job
  displayName: Build and Deploy Job
  pool:
    vmImage: ubuntu-latest

  variables:
  - group: Azure-Static-Web-Apps-mango-bush-0a726a800-variable-group

  steps:
  - checkout: self
    submodules: true

  - task: AzureStaticWebApp@0
    displayName: "Deploy Next.js SSR App"
    inputs:
      azure_static_web_apps_api_token: $(deployment_token)
      app_location: "/"        # root of Next.js
      api_location: ""         # EMPTY for Next.js app/api
      output_location: ""      # EMPTY for SSR build
